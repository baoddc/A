    @keyframes spin {

    h2 {
      color: #f8fafc;
      font-size: 1.15rem;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 0.9rem;

    a {

      text-decoration: none;
      font-weight: 600;
    }
